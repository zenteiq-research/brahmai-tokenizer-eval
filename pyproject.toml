[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brahmai-tokenizer-eval"
version = "1.0.0"
description = "Reproducible tokenizer evaluation: tokens per byte, fertility, token premium, and diagnostic probes, with Indic-language coverage"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "ZenteiQ AiTech Innovations Pvt. Ltd.", email = "research@zenteiq.ai"}]
keywords = ["tokenizer", "evaluation", "benchmark", "Indic", "NLP"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tokenizers>=0.20",
  "huggingface_hub>=0.25",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "regex>=2023.0",
  "rich>=13.0",
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
transformers = ["transformers>=4.40", "sentencepiece>=0.2", "protobuf>=4"]
test = ["pytest>=8", "setuptools>=77"]

[project.scripts]
brahmai-tokenizer-eval = "brahmai_tokenizer_eval.cli:main"
bte = "brahmai_tokenizer_eval.cli:main"

[tool.setuptools.packages.find]
include = ["brahmai_tokenizer_eval*"]

[tool.setuptools.package-data]
brahmai_tokenizer_eval = ["data/corpora.lock.json", "data/shipped/*.md", "data/shipped/**/*", "data/licence_texts/*.txt", "data/CITATIONS.bib"]

[project.urls]
Homepage = "https://github.com/zenteiq-research/brahmai-tokenizer-eval"
Issues = "https://github.com/zenteiq-research/brahmai-tokenizer-eval/issues"
